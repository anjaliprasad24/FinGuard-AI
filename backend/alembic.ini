[alembic]
# Path to migration scripts
script_location = alembic

# Revision file naming template
file_template = %%(rev)s_%%(slug)s

# Add backend directory to sys.path so app modules are importable
sys_path = .

# Truncate tracebacks in CLI output
truncate_slug_length = 40

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sentinel,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sentinel]
level = WARN
handlers =
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
